name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine-linux:
    name: Engine (Linux, headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DZYPHER_BUILD_TESTS=ON -DZYPHER_BUILD_EDITOR=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Cook demo pack
        run: cargo run --quiet --manifest-path tools/assetcooker/Cargo.toml -- --project samples/demo/zypher.project.json
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate assets
        run: python3 tools/scripts/validate_assets.py samples/demo/zypher.project.json
      - name: Render a reference frame
        run: >
          ./build/bin/zypher_runtime
          --scene samples/demo/scene.zscene
          --pack samples/demo/dist/demo.zpkg
          --output artifacts --width 640 --height 360
          --frames 2 --steps 120 --dump-frame
      - name: Upload reference frame
        uses: actions/upload-artifact@v4
        with:
          name: reference-frame
          path: artifacts/frame.png
          if-no-files-found: error

  rust-cooker:
    name: Rust asset cooker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --manifest-path tools/assetcooker/Cargo.toml
      - run: cargo clippy --manifest-path tools/assetcooker/Cargo.toml -- -D warnings
        continue-on-error: true

  typescript-panels:
    name: TypeScript editor panels
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editor/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  csharp-scripting:
    name: C# scripting layer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build tools/Zypher.Scripting.Tests/Zypher.Scripting.Tests.csproj -c Release --nologo
      - run: dotnet run --project tools/Zypher.Scripting.Tests/Zypher.Scripting.Tests.csproj -c Release

  python-tools:
    name: Python tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Byte-compile scripts
        run: python3 -m py_compile tools/scripts/*.py
      - name: Validate workflow YAML
        run: |
          python3 - <<'PY'
          import glob, yaml
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              with open(path, encoding='utf-8') as stream:
                  yaml.safe_load(stream)
              print('ok', path)
          PY
      - name: Package smoke test
        run: |
          mkdir -p stage/bin stage/share
          cp README.md stage/share/
          cp tools/installer/macos/Zypher.command stage/
          python3 tools/scripts/package_release.py --version 0.0.0 \
              --platform smoke --input stage --output dist
          test -f dist/zypher-0.0.0-smoke.zip
          test -f dist/zypher-0.0.0-smoke.sha256
          python3 - <<'PY'
          import stat, zipfile
          info = zipfile.ZipFile('dist/zypher-0.0.0-smoke.zip').getinfo('zypher-0.0.0-smoke/Zypher.command')
          mode = info.external_attr >> 16
          if not stat.S_IMODE(mode) & stat.S_IXUSR:
              raise SystemExit('Zypher.command is not executable inside the archive')
          print('Zypher.command is executable in the archive')
          PY

  macos:
    name: macOS build + tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DZYPHER_BUILD_TESTS=ON -DZYPHER_BUILD_EDITOR=ON
      - name: Build
        run: |
          # GitHub runs steps with bash -e; keep going so the diagnostics below run.
          set +e
          set -o pipefail
          # No `|| true` here: running `true` resets PIPESTATUS and hides failures.
          cmake --build build --parallel 2 2>&1 | tee build.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::macOS build failed; compiler diagnostics follow"
            grep -n -B2 -A4 -E 'error:|fatal error|Undefined symbols|FAILED:|ld: ' build.log | head -n 40 \
              | tr -d '\r' | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
            exit "$status"
          fi
      - name: Cook demo pack
        run: cargo run --quiet --manifest-path tools/assetcooker/Cargo.toml -- --project samples/demo/zypher.project.json
      - name: Test
        run: |
          set +e
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log || true
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::macOS test failure; ctest output follows"
            tail -n 30 ctest.log | tr -d '\r' | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            exit "$status"
          fi
      - name: Package smoke test (dmg)
        run: |
          set -o pipefail
          src="$RUNNER_TEMP/dmg-src"
          rm -rf "$src" && mkdir -p "$src/bin"
          cp build/bin/zypher_runtime "$src/bin/"
          cp tools/installer/macos/Zypher.command "$src/"
          chmod 755 "$src/Zypher.command"
          ln -s /Applications "$src/Applications"
          dmg="$RUNNER_TEMP/zypher-smoke.dmg"
          rm -f "$dmg"
          hdiutil create -volname ZypherSmoke -srcfolder "$src" -ov -format UDZO "$dmg" > /dev/null
          test -s "$dmg"
          mount_point="$RUNNER_TEMP/dmg-mnt"
          rm -rf "$mount_point" && mkdir -p "$mount_point"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point" > /dev/null
          test -x "$mount_point/Zypher.command"
          test -L "$mount_point/Applications"
          "$mount_point/Zypher.command" --version
          hdiutil detach "$mount_point" > /dev/null
          echo "disk image mounts and its launcher runs"

  windows:
    name: Windows build + tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Configure
        run: cmake -S . -B build -A x64 -DZYPHER_BUILD_TESTS=ON -DZYPHER_BUILD_EDITOR=ON
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config RelWithDebInfo --parallel 2 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Windows build failed; compiler diagnostics follow"
            $lines = Select-String -Path build.log -Pattern 'error|fatal error|LNK[0-9]+' | Select-Object -First 20
            foreach ($line in $lines) {
              $text = $line.Line.Trim()
              if ($text.Length -gt 900) { $text = $text.Substring(0, 900) }
              Write-Host "::error::$text"
            }
            exit 1
          }
      - name: Cook demo pack
        run: cargo run --quiet --manifest-path tools/assetcooker/Cargo.toml -- --project samples/demo/zypher.project.json
      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
      - name: Package smoke test (exe installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'installer-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'bin') | Out-Null
          $runtime = Get-ChildItem -Path build -Recurse -Filter 'zypher_runtime.exe' -File | Select-Object -First 1
          if (-not $runtime) { throw 'zypher_runtime.exe was not built' }
          Copy-Item $runtime.FullName (Join-Path $stage 'bin/zypher_runtime.exe')
          Copy-Item tools/installer/windows/Zypher.cmd $stage
          $dist = Join-Path $env:RUNNER_TEMP 'installer-dist'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $isccCandidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host 'Inno Setup is not on this image; installing it with Chocolatey'
            choco install innosetup --yes --no-progress | Out-Host
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe (Inno Setup) is required to build the Windows installer' }

          & $iscc '/DMyVersion=0.0.0' "/DStageDir=$stage" "/DOutputDir=$dist" 'tools/installer/zypher.iss' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          $installer = Join-Path $dist 'zypher-0.0.0-windows-x64.exe'
          if (-not (Test-Path $installer)) { throw 'the installer was not created' }

          $probe = Join-Path $env:RUNNER_TEMP 'ZypherSmokeInstall'
          if (Test-Path $probe) { Remove-Item $probe -Recurse -Force }
          $install = Start-Process -FilePath $installer `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$probe" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the installer exited with $($install.ExitCode)" }

          $installedRuntime = Join-Path $probe 'bin/zypher_runtime.exe'
          $installedLauncher = Join-Path $probe 'Zypher.cmd'
          if (-not (Test-Path $installedRuntime)) { throw 'the installer did not lay down bin\zypher_runtime.exe' }
          if (-not (Test-Path $installedLauncher)) { throw 'the installer did not lay down Zypher.cmd' }
          $reported = cmd /c "`"$installedLauncher`" --version"
          Write-Host "installed launcher reported: $reported"
          if ($reported -notmatch 'Zypher') { throw 'the installed launcher did not reach the runtime' }

          $uninstaller = Join-Path $probe 'unins000.exe'
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "the uninstaller exited with $($uninstall.ExitCode)" }
          }
          Write-Host "installer works: $((Get-Item $installer).Length) bytes, silent install and uninstall verified"
