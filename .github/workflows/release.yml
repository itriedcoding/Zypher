name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal
    runs-on: macos-15
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches project version
        run: |
          version=$(grep -m1 'project(Zypher' -A2 CMakeLists.txt | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | head -1)
          if [ "v${version}" != "${VERSION}" ]; then
            echo "tag ${VERSION} does not match project version v${version}" >&2
            exit 1
          fi
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          python3 --version
      - name: Configure (universal)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DZYPHER_BUILD_TESTS=ON -DZYPHER_BUILD_EDITOR=ON
      - name: Build
        run: |
          # GitHub runs steps with bash -e; keep going so diagnostics are reported.
          set +e
          set -o pipefail
          cmake --build build --parallel 2 2>&1 | tee build.log || true
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::macOS universal build failed; diagnostics follow"
            { grep -E 'error|fatal|Undefined|FAILED|ld: ' build.log | head -n 15; tail -n 15 build.log; } \
              | tr -d '\r' | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
            exit "$status"
          fi
      - name: Cook demo pack
        run: cargo run --quiet --manifest-path tools/assetcooker/Cargo.toml -- --project samples/demo/zypher.project.json
      - name: Test
        run: |
          set +e
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log || true
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::macOS test failure; ctest output follows"
            tail -n 30 ctest.log | tr -d '\r' | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            exit "$status"
          fi
      - name: Stage
        env:
          VERSION_NUMBER: ${{ env.VERSION }}
        run: |
          # GitHub runs steps with bash -e; trace and capture so a failure here is
          # visible as annotations (job logs are not readable without admin rights).
          set +e
          set -o pipefail
          run_stage() {
            version="${VERSION#v}"
            cmake --install build --prefix stage
            mkdir -p stage/share/zypher
            cp -R samples stage/share/zypher/samples
            cp -R engine/shaders stage/share/zypher/shaders
            cp -R docs stage/share/zypher/docs
            cp README.md LICENSE stage/share/zypher/
            python3 tools/scripts/package_release.py \
                --version "$version" --platform macos-universal \
                --input stage --output dist
          }
          set -x
          run_stage 2>&1 | tee stage.log
          status=${PIPESTATUS[0]}
          set +x
          if [ "$status" -ne 0 ]; then
            echo "::error::macOS staging failed; trace follows"
            tail -n 30 stage.log | tr -d '\r' | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches project version
        shell: bash
        run: |
          version=$(grep -m1 'project(Zypher' -A2 CMakeLists.txt | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | head -1)
          if [ "v${version}" != "${VERSION}" ]; then
            echo "tag ${VERSION} does not match project version v${version}" >&2
            exit 1
          fi
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Configure
        run: cmake -S . -B build -A x64 -DZYPHER_BUILD_TESTS=ON -DZYPHER_BUILD_EDITOR=ON
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Windows release build failed; compiler diagnostics follow"
            $lines = Select-String -Path build.log -Pattern 'error|fatal error|LNK[0-9]+' | Select-Object -First 20
            foreach ($line in $lines) {
              $text = $line.Line.Trim()
              if ($text.Length -gt 900) { $text = $text.Substring(0, 900) }
              Write-Host "::error::$text"
            }
            exit 1
          }
      - name: Cook demo pack
        run: cargo run --quiet --manifest-path tools/assetcooker/Cargo.toml -- --project samples/demo/zypher.project.json
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v')
          cmake --install build --config Release --prefix stage
          New-Item -ItemType Directory -Force -Path stage/share/zypher | Out-Null
          Copy-Item samples stage/share/zypher/samples -Recurse
          Copy-Item engine/shaders stage/share/zypher/shaders -Recurse
          Copy-Item docs stage/share/zypher/docs -Recurse
          Copy-Item README.md, LICENSE stage/share/zypher/
          python tools/scripts/package_release.py --version $version --platform windows-x64 --input stage --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lh dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; updating assets"
            gh release upload "$VERSION" dist/*.zip dist/*.sha256 --clobber
          else
            # Creates the tag at the dispatched commit when it does not exist yet.
            gh release create "$VERSION" dist/*.zip dist/*.sha256 \
              --title "Zypher ${VERSION#v}" \
              --notes-file docs/releases.md \
              --target "$GITHUB_SHA"
          fi
