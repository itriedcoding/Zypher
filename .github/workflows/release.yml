name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2)"
        required: true
        type: string

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"

jobs:
  macos:
    name: macOS universal
    runs-on: macos-15
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches project version
        run: |
          version=$(grep -m1 'project(Zypher' -A2 CMakeLists.txt | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | head -1)
          if [ "v${version}" != "${VERSION}" ]; then
            echo "tag ${VERSION} does not match project version v${version}" >&2
            exit 1
          fi
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          python3 --version
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ env.QT_VERSION }}-macos-clang_64
      - name: Install Qt
        run: |
          qt_dir="$RUNNER_TEMP/Qt/$QT_VERSION/macos"
          if [ ! -f "$qt_dir/lib/cmake/Qt6/Qt6Config.cmake" ]; then
            python3 -m venv "$RUNNER_TEMP/aqt"
            "$RUNNER_TEMP/aqt/bin/pip" install --quiet --upgrade aqtinstall
            "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 --outputdir "$RUNNER_TEMP/Qt"
          fi
          test -f "$qt_dir/lib/cmake/Qt6/Qt6Config.cmake"
          echo "QT_DIR=$qt_dir" >> "$GITHUB_ENV"
      - name: Configure (universal)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_PREFIX_PATH="$QT_DIR"
          -DZYPHER_BUILD_TESTS=ON -DZYPHER_BUILD_EDITOR=ON
      - name: Build
        run: |
          # GitHub runs steps with bash -e; keep going so diagnostics are reported.
          set +e
          set -o pipefail
          # No `|| true` here: running `true` resets PIPESTATUS and hides failures.
          cmake --build build --parallel 2 2>&1 | tee build.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::macOS universal build failed; diagnostics follow"
            grep -n -B2 -A4 -E 'error:|fatal error|Undefined symbols|FAILED:|ld: ' build.log | head -n 40 \
              | tr -d '\r' | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
            exit "$status"
          fi
      - name: Cook demo pack
        run: cargo run --quiet --manifest-path tools/assetcooker/Cargo.toml -- --project samples/demo/zypher.project.json
      - name: Test
        run: |
          set +e
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log || true
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::macOS test failure; ctest output follows"
            tail -n 30 ctest.log | tr -d '\r' | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            exit "$status"
          fi
      - name: Stage
        run: |
          # Stage explicitly: `cmake --install` does not work on the universal
          # macOS build and previously shipped a package with no runtime. The
          # artifacts are located anywhere in the workspace, then asserted.
          set -o pipefail
          run_stage() {
            set -e
            version="${VERSION#v}"
            prefix="$GITHUB_WORKSPACE/stage"
            rm -rf "$prefix"
            mkdir -p "$prefix/bin" "$prefix/lib" "$prefix/include/zypher-editor" "$prefix/share/zypher"

            runtime_bin=$(find "$GITHUB_WORKSPACE" -path '*/.git' -prune -o -type f -name 'zypher_runtime' -print -quit)
            engine_lib=$(find "$GITHUB_WORKSPACE" -path '*/.git' -prune -o -type f -name 'libzypher_engine.a' -print -quit)
            editor_lib=$(find "$GITHUB_WORKSPACE" -path '*/.git' -prune -o -type f -name 'libzypher_editor_core.a' -print -quit)
            editor_app=$(find "$GITHUB_WORKSPACE/build" -type d -name 'zypher_editor.app' -print -quit)

            if [ -z "$runtime_bin" ] || [ -z "$engine_lib" ] || [ -z "$editor_app" ]; then
              echo "::error::staged artifacts not found (runtime='${runtime_bin}' engine='${engine_lib}' editor='${editor_app}')"
              echo "::error::build dir: $(ls -A "$GITHUB_WORKSPACE/build" 2>&1 | tr '\n' ' ')"
              echo "::error::build/bin: $(ls -A "$GITHUB_WORKSPACE/build/bin" 2>&1 | tr '\n' ' ')"
              echo "::error::build.log tail: $(tail -n 4 "$GITHUB_WORKSPACE/build.log" 2>&1 | tr '\n' ' ')"
              return 1
            fi

            install -m 755 "$runtime_bin" "$prefix/bin/zypher_runtime"
            install -m 644 "$engine_lib" "$prefix/lib/libzypher_engine.a"
            if [ -n "$editor_lib" ]; then
              install -m 644 "$editor_lib" "$prefix/lib/libzypher_editor_core.a"
            fi
            cp -R engine/include/zypher "$prefix/include/"
            cp -R editor/core "$prefix/include/zypher-editor/"
            cp -R engine/shaders "$prefix/share/zypher/shaders"
            cp -R samples "$prefix/share/zypher/samples"
            cp -R docs "$prefix/share/zypher/docs"
            cp README.md LICENSE "$prefix/share/zypher/"
            # Double-click entry point: opens the editor, or renders the demo.
            install -m 755 tools/installer/macos/Zypher.command "$prefix/Zypher.command"

            # Portable archive keeps the command line payload (a .app bundle
            # needs its framework symlinks, which the reproducible zip drops).
            python3 tools/scripts/package_release.py \
                --version "$version" --platform macos-universal \
                --input "$prefix" --output dist
            python3 - "dist/zypher-${version}-macos-universal.zip" <<'PY'
          import sys
          import zipfile
          members = zipfile.ZipFile(sys.argv[1]).namelist()
          missing = [required for required in ("bin/zypher_runtime", "lib/libzypher_engine.a", "Zypher.command")
                     if not any(name.endswith(required) for name in members)]
          if missing:
              print(f"::error::packaged archive is missing {missing}")
              for name in members[:40]:
                  print(f"::error::member {name}")
              raise SystemExit(1)
          print(f"packaged archive verified ({len(members)} files)")
          PY

            # Editor app bundle with its Qt frameworks, inside the disk image.
            echo "::notice::stage: deploying the Qt runtime into the editor app"
            if ! "$QT_DIR/bin/macdeployqt" "$editor_app" -always-overwrite -no-translations \
                "-qmldir=$GITHUB_WORKSPACE/editor/qml" > "$RUNNER_TEMP/macdeployqt.log" 2>&1; then
              echo "::error::macdeployqt failed"
              tail -n 40 "$RUNNER_TEMP/macdeployqt.log" | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
              return 1
            fi
            cp -R "$editor_app" "$prefix/Zypher Editor.app"
            mkdir -p "$prefix/Zypher Editor.app/Contents/Resources/share"
            cp -R "$prefix/share/zypher" "$prefix/Zypher Editor.app/Contents/Resources/share/zypher"

            # Headless platform plugins, needed by the startup check below and by
            # automation; macdeployqt does not copy them on every Qt version.
            app_platforms="$prefix/Zypher Editor.app/Contents/PlugIns/platforms"
            mkdir -p "$app_platforms"
            for plugin in libqoffscreen.dylib libqminimal.dylib; do
              if [ ! -f "$app_platforms/$plugin" ] && [ -f "$QT_DIR/plugins/platforms/$plugin" ]; then
                cp "$QT_DIR/plugins/platforms/$plugin" "$app_platforms/"
              fi
            done
            test -d "$prefix/Zypher Editor.app/Contents/MacOS"

            dmg="zypher-${version}-macos-universal.dmg"
            rm -f "dist/$dmg"
            dmg_src="$RUNNER_TEMP/dmg-src"
            rm -rf "$dmg_src"
            cp -R "$prefix" "$dmg_src"
            ln -s /Applications "$dmg_src/Applications"
            hdiutil create -volname "Zypher ${version}" -srcfolder "$dmg_src" -ov -format UDZO "dist/$dmg" > /dev/null
            test -s "dist/$dmg"

            # Prove the image is usable: mount it, run the launcher, and start the
            # editor from the mounted volume before anything is published.
            mount_point="$RUNNER_TEMP/dmg-mnt"
            rm -rf "$mount_point" && mkdir -p "$mount_point"
            hdiutil attach "dist/$dmg" -nobrowse -readonly -mountpoint "$mount_point" > /dev/null
            if [ ! -x "$mount_point/Zypher.command" ] || [ ! -L "$mount_point/Applications" ]; then
              echo "::error::the disk image is missing Zypher.command or the Applications shortcut"
              hdiutil detach "$mount_point" > /dev/null || true
              return 1
            fi

            reported=$("$mount_point/Zypher.command" --version)
            echo "mounted launcher reported: $reported"
            case "$reported" in
              *"$version"*) ;;
              *)
                echo "::error::the mounted runtime reported '${reported}' instead of ${version}"
                hdiutil detach "$mount_point" > /dev/null || true
                return 1
                ;;
            esac

            echo "::notice::stage: starting the packaged editor"
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
              "$mount_point/Zypher Editor.app/Contents/MacOS/zypher_editor" --check \
              > "$RUNNER_TEMP/editor-check.log" 2>&1 || {
                echo "::error::the editor self check failed"
                tail -n 40 "$RUNNER_TEMP/editor-check.log" | tr -d '\r' | while IFS= read -r line; do
                  echo "::error::${line:0:900}"
                done
                hdiutil detach "$mount_point" > /dev/null || true
                return 1
              }
            cat "$RUNNER_TEMP/editor-check.log"
            QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
              "$mount_point/Zypher Editor.app/Contents/MacOS/zypher_editor" > "$RUNNER_TEMP/editor.log" 2>&1 &
            editor_pid=$!
            sleep 8
            if ! kill -0 "$editor_pid" 2>/dev/null; then
              echo "::error::the editor exited during startup; output follows"
              tail -n 30 "$RUNNER_TEMP/editor.log" | tr -d '\r' | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
              hdiutil detach "$mount_point" > /dev/null || true
              return 1
            fi
            kill "$editor_pid" 2>/dev/null || true
            wait "$editor_pid" 2>/dev/null || true
            echo "editor started from the mounted image"
            hdiutil detach "$mount_point" > /dev/null

            ( cd dist && shasum -a 256 "$dmg" > "$dmg.sha256" )
            echo "created and verified $dmg"
          }
          run_stage
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches project version
        shell: bash
        run: |
          version=$(grep -m1 'project(Zypher' -A2 CMakeLists.txt | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | head -1)
          if [ "v${version}" != "${VERSION}" ]; then
            echo "tag ${VERSION} does not match project version v${version}" >&2
            exit 1
          fi
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\Qt
          key: qt-${{ env.QT_VERSION }}-windows-msvc2022_64
      - name: Install Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtDir = Join-Path $env:RUNNER_TEMP "Qt/$env:QT_VERSION/msvc2022_64"
          if (-not (Test-Path (Join-Path $qtDir 'lib/cmake/Qt6/Qt6Config.cmake'))) {
            $env:PATH = "C:\Program Files\7-Zip;$env:PATH"
            python -m pip install --upgrade --quiet aqtinstall
            python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir (Join-Path $env:RUNNER_TEMP 'Qt') --external 7z
          }
          if (-not (Test-Path (Join-Path $qtDir 'lib/cmake/Qt6/Qt6Config.cmake'))) { throw "Qt was not installed at $qtDir" }
          "QT_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_DIR" -DZYPHER_BUILD_TESTS=ON -DZYPHER_BUILD_EDITOR=ON
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Windows release build failed; compiler diagnostics follow"
            $lines = Select-String -Path build.log -Pattern 'error|fatal error|LNK[0-9]+' | Select-Object -First 20
            foreach ($line in $lines) {
              $text = $line.Line.Trim()
              if ($text.Length -gt 900) { $text = $text.Substring(0, 900) }
              Write-Host "::error::$text"
            }
            exit 1
          }
      - name: Cook demo pack
        run: cargo run --quiet --manifest-path tools/assetcooker/Cargo.toml -- --project samples/demo/zypher.project.json
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION.TrimStart('v')
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'stage'
          if (Test-Path $prefix) { Remove-Item $prefix -Recurse -Force }
          $share = Join-Path $prefix 'share/zypher'
          New-Item -ItemType Directory -Force -Path (Join-Path $prefix 'bin'), (Join-Path $prefix 'lib'), (Join-Path $prefix 'include/zypher-editor'), $share | Out-Null

          $runtime = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter 'zypher_runtime.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $engineLib = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter 'zypher_engine.lib' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $editor = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter 'zypher_editor.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtime) { throw 'zypher_runtime.exe was not built' }
          if (-not $engineLib) { throw 'zypher_engine.lib was not built' }
          if (-not $editor) { throw 'zypher_editor.exe was not built: the Qt editor shell is required for releases' }

          Copy-Item $runtime.FullName (Join-Path $prefix 'bin/zypher_runtime.exe')
          Copy-Item $engineLib.FullName (Join-Path $prefix 'lib/zypher_engine.lib')
          Copy-Item $editor.FullName (Join-Path $prefix 'bin/zypher_editor.exe')
          $editorLib = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter 'zypher_editor_core.lib' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($editorLib) { Copy-Item $editorLib.FullName (Join-Path $prefix 'lib/zypher_editor_core.lib') }
          Copy-Item engine/include/zypher (Join-Path $prefix 'include/zypher') -Recurse
          Copy-Item editor/core (Join-Path $prefix 'include/zypher-editor/core') -Recurse
          Copy-Item engine/shaders (Join-Path $share 'shaders') -Recurse
          Copy-Item samples (Join-Path $share 'samples') -Recurse
          Copy-Item docs (Join-Path $share 'docs') -Recurse
          Copy-Item README.md, LICENSE $share
          Copy-Item tools/installer/windows/Zypher.cmd (Join-Path $prefix 'Zypher.cmd')

          # Deploy the Qt runtime the editor needs (DLLs, plugins, QML modules).
          $windeployqt = Join-Path $env:QT_DIR 'bin/windeployqt.exe'
          if (-not (Test-Path $windeployqt)) { throw "windeployqt was not found at $windeployqt" }
          & $windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw `
            --qmldir (Join-Path $env:GITHUB_WORKSPACE 'editor/qml') (Join-Path $prefix 'bin/zypher_editor.exe') | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with $LASTEXITCODE" }

          # Headless platform plugin, used by the startup check below.
          $offscreen = Join-Path $env:QT_DIR 'plugins/platforms/qoffscreen.dll'
          $platformDir = Join-Path $prefix 'bin/platforms'
          if ((Test-Path $offscreen) -and -not (Test-Path (Join-Path $platformDir 'qoffscreen.dll'))) {
            New-Item -ItemType Directory -Force -Path $platformDir | Out-Null
            Copy-Item $offscreen $platformDir
          }
          $subsystem = python tools/scripts/pe_subsystem.py (Join-Path $prefix 'bin/zypher_editor.exe')
          if ([int]$subsystem -ne 2) { throw "zypher_editor.exe uses the console subsystem ($subsystem), not the GUI subsystem" }

          python tools/scripts/package_release.py --version $version --platform windows-x64 --input $prefix --output dist
          if ($LASTEXITCODE -ne 0) { throw "packaging failed with $LASTEXITCODE" }
          python -c "import sys, zipfile; m = zipfile.ZipFile(sys.argv[1]).namelist(); missing = [n for n in ('bin/zypher_runtime.exe', 'bin/zypher_editor.exe', 'Zypher.cmd') if not any(x.endswith(n) for x in m)]; sys.exit(1 if missing else 0)" "dist/zypher-$version-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'packaged archive is missing the runtime, the editor or Zypher.cmd' }
      - name: Build and verify Windows installer
        shell: pwsh
        run: |
          # A real installer (Inno Setup), not a self-extracting archive: it
          # installs the editor with its Qt runtime, adds Start Menu and optional
          # desktop shortcuts, registers an uninstaller and offers to launch the
          # editor. The old 7-Zip SFX build only unpacked to a temporary folder
          # and exited, which looked like a console opening and closing.
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION.TrimStart('v')
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'stage'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'

          $isccCandidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host 'Inno Setup is not on this image; installing it with Chocolatey'
            choco install innosetup --yes --no-progress | Out-Host
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe (Inno Setup) is required to build the Windows installer' }
          Write-Host "using $iscc"

          & $iscc "/DMyVersion=$version" "/DStageDir=$prefix" "/DOutputDir=$dist" 'tools/installer/zypher.iss' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

          $installerName = "zypher-$version-windows-x64.exe"
          $installer = Join-Path $dist $installerName
          if (-not (Test-Path $installer)) { throw 'the Windows installer was not created' }
          $installerBytes = (Get-Item $installer).Length
          if ($installerBytes -lt 5MB) { throw "the Windows installer is suspiciously small ($installerBytes bytes)" }

          # Install silently, then exercise the installed copy the way a user would.
          $probe = Join-Path $env:RUNNER_TEMP 'ZypherInstallProbe'
          if (Test-Path $probe) { Remove-Item $probe -Recurse -Force }
          $installLog = Join-Path $env:RUNNER_TEMP 'zypher-install.log'
          $install = Start-Process -FilePath $installer `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$probe", "/LOG=$installLog" `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            if (Test-Path $installLog) {
              Get-Content $installLog | Select-Object -Last 40 | ForEach-Object { Write-Host "::error::$_" }
            }
            throw "the installer exited with $($install.ExitCode)"
          }

          $installedRuntime = Join-Path $probe 'bin/zypher_runtime.exe'
          $installedEditor = Join-Path $probe 'bin/zypher_editor.exe'
          $installedLauncher = Join-Path $probe 'Zypher.cmd'
          foreach ($required in @($installedRuntime, $installedEditor, $installedLauncher)) {
            if (-not (Test-Path $required)) { throw "the installer did not lay down $required" }
          }
          if (-not (Test-Path (Join-Path $probe 'share/zypher/samples/demo/scene.zscene'))) { throw 'the installer did not lay down the demo scene' }

          $reported = & $installedRuntime --version
          Write-Host "installed runtime: $reported"
          if ($LASTEXITCODE -ne 0) { throw 'the installed runtime failed to report its version' }
          if ($reported -notmatch [regex]::Escape($version)) { throw "the installed runtime reported '$reported' instead of $version" }

          $launched = cmd /c "`"$installedLauncher`" --version"
          Write-Host "launcher output: $launched"
          if ($launched -notmatch [regex]::Escape($version)) { throw 'Zypher.cmd did not reach the runtime' }

          $artifacts = Join-Path $probe 'probe-artifacts'
          & $installedRuntime --scene (Join-Path $probe 'share/zypher/samples/demo/scene.zscene') `
            --pack (Join-Path $probe 'share/zypher/samples/demo/dist/demo.zpkg') `
            --output $artifacts --width 320 --height 180 --frames 1 --steps 30 --dump-frame | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'the installed runtime failed to render the demo' }
          if (-not (Test-Path (Join-Path $artifacts 'frame.png'))) { throw 'the installed runtime did not write frame.png' }

          # The editor must open (GUI subsystem, Qt runtime and QML module present).
          $subsystem = python tools/scripts/pe_subsystem.py $installedEditor
          Write-Host "installed editor PE subsystem: $subsystem (2 = Windows GUI, no console window)"
          if ([int]$subsystem -ne 2) { throw "zypher_editor.exe uses the console subsystem ($subsystem)" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $checkLog = Join-Path $env:RUNNER_TEMP 'editor-check.log'
          & $installedEditor --check *> $checkLog
          $checkExit = $LASTEXITCODE
          Get-Content $checkLog -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          if ($checkExit -ne 0) {
            Get-Content $checkLog -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object { Write-Host "::error::$_" }
            throw "the installed editor self check failed with $checkExit"
          }
          $editorOut = Join-Path $env:RUNNER_TEMP 'editor-out.log'
          $editorErr = Join-Path $env:RUNNER_TEMP 'editor-err.log'
          $editorProcess = Start-Process -FilePath $installedEditor -PassThru `
            -RedirectStandardOutput $editorOut -RedirectStandardError $editorErr
          Start-Sleep -Seconds 10
          if ($editorProcess.HasExited) {
            Write-Host "::error::the editor exited during startup with code $($editorProcess.ExitCode)"
            foreach ($log in @($editorOut, $editorErr)) {
              if (Test-Path $log) {
                Get-Content $log | Select-Object -Last 40 | ForEach-Object { Write-Host "::error::$_" }
              }
            }
            throw 'the editor did not stay running'
          }
          Stop-Process -Id $editorProcess.Id -Force
          Write-Host 'editor started and stayed running'

          $uninstaller = Join-Path $probe 'unins000.exe'
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "the uninstaller exited with $($uninstall.ExitCode)" }
            if (Test-Path (Join-Path $probe 'bin')) { throw 'the uninstaller left files behind' }
            Write-Host 'uninstaller verified'
          } else {
            Write-Host '::warning::no uninstaller was generated'
          }

          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$installerHash  $installerName" | Out-File -Encoding ascii (Join-Path $dist "$installerName.sha256")
          Write-Host "created $installerName ($installerBytes bytes); editor startup, demo render and uninstall verified"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lh dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; updating assets and notes"
            gh release upload "$VERSION" dist/* --clobber
            gh release edit "$VERSION" --notes-file docs/releases.md
          else
            # Creates the tag at the dispatched commit when it does not exist yet.
            gh release create "$VERSION" dist/* \
              --title "Zypher ${VERSION#v}" \
              --notes-file docs/releases.md \
              --target "$GITHUB_SHA"
          fi
