name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal
    runs-on: macos-15
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches project version
        run: |
          version=$(grep -m1 'project(Zypher' -A2 CMakeLists.txt | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | head -1)
          if [ "v${version}" != "${VERSION}" ]; then
            echo "tag ${VERSION} does not match project version v${version}" >&2
            exit 1
          fi
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          python3 --version
      - name: Configure (universal)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DZYPHER_BUILD_TESTS=ON -DZYPHER_BUILD_EDITOR=ON
      - name: Build
        run: |
          # GitHub runs steps with bash -e; keep going so diagnostics are reported.
          set +e
          set -o pipefail
          cmake --build build --parallel 2 2>&1 | tee build.log || true
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::macOS universal build failed; diagnostics follow"
            { grep -E 'error|fatal|Undefined|FAILED|ld: ' build.log | head -n 15; tail -n 15 build.log; } \
              | tr -d '\r' | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
            exit "$status"
          fi
      - name: Cook demo pack
        run: cargo run --quiet --manifest-path tools/assetcooker/Cargo.toml -- --project samples/demo/zypher.project.json
      - name: Test
        run: |
          set +e
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log || true
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::macOS test failure; ctest output follows"
            tail -n 30 ctest.log | tr -d '\r' | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            exit "$status"
          fi
      - name: Stage
        env:
          VERSION_NUMBER: ${{ env.VERSION }}
        run: |
          # Stage explicitly: `cmake --install` does not work on the universal
          # macOS build and previously shipped a package with no runtime. The
          # artifacts are located anywhere in the workspace, then asserted.
          set -o pipefail
          run_stage() {
            set -e
            version="${VERSION#v}"
            prefix="$GITHUB_WORKSPACE/stage"
            rm -rf "$prefix"
            mkdir -p "$prefix/bin" "$prefix/lib" "$prefix/include/zypher-editor" "$prefix/share/zypher"

            runtime_bin=$(find "$GITHUB_WORKSPACE" -path '*/.git' -prune -o -type f -name 'zypher_runtime' -print -quit)
            engine_lib=$(find "$GITHUB_WORKSPACE" -path '*/.git' -prune -o -type f -name 'libzypher_engine.a' -print -quit)
            editor_lib=$(find "$GITHUB_WORKSPACE" -path '*/.git' -prune -o -type f -name 'libzypher_editor_core.a' -print -quit)

            if [ -z "$runtime_bin" ] || [ -z "$engine_lib" ]; then
              echo "::error::staged artifacts not found (runtime='${runtime_bin}' engine='${engine_lib}')"
              echo "::error::workspace top level: $(ls -A "$GITHUB_WORKSPACE" | tr '\n' ' ')"
              echo "::error::build tree: $(find "$GITHUB_WORKSPACE/build" -maxdepth 2 -type d 2>/dev/null | head -n 8 | tr '\n' ' ')"
              return 1
            fi

            install -m 755 "$runtime_bin" "$prefix/bin/zypher_runtime"
            install -m 644 "$engine_lib" "$prefix/lib/libzypher_engine.a"
            if [ -n "$editor_lib" ]; then
              install -m 644 "$editor_lib" "$prefix/lib/libzypher_editor_core.a"
            fi
            cp -R engine/include/zypher "$prefix/include/"
            cp -R editor/core "$prefix/include/zypher-editor/"
            cp -R engine/shaders "$prefix/share/zypher/shaders"
            cp -R samples "$prefix/share/zypher/samples"
            cp -R docs "$prefix/share/zypher/docs"
            cp README.md LICENSE "$prefix/share/zypher/"

            python3 tools/scripts/package_release.py \
                --version "$version" --platform macos-universal \
                --input "$prefix" --output dist
            python3 - "dist/zypher-${version}-macos-universal.zip" <<'PY'
          import sys
          import zipfile
          members = zipfile.ZipFile(sys.argv[1]).namelist()
          for required in ("bin/zypher_runtime", "lib/libzypher_engine.a"):
              if not any(name.endswith(required) for name in members):
                  raise SystemExit(f"packaged archive is missing {required}")
          print(f"packaged archive verified ({len(members)} files)")
          PY
          }
          run_stage
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches project version
        shell: bash
        run: |
          version=$(grep -m1 'project(Zypher' -A2 CMakeLists.txt | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | head -1)
          if [ "v${version}" != "${VERSION}" ]; then
            echo "tag ${VERSION} does not match project version v${version}" >&2
            exit 1
          fi
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Configure
        run: cmake -S . -B build -A x64 -DZYPHER_BUILD_TESTS=ON -DZYPHER_BUILD_EDITOR=ON
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Windows release build failed; compiler diagnostics follow"
            $lines = Select-String -Path build.log -Pattern 'error|fatal error|LNK[0-9]+' | Select-Object -First 20
            foreach ($line in $lines) {
              $text = $line.Line.Trim()
              if ($text.Length -gt 900) { $text = $text.Substring(0, 900) }
              Write-Host "::error::$text"
            }
            exit 1
          }
      - name: Cook demo pack
        run: cargo run --quiet --manifest-path tools/assetcooker/Cargo.toml -- --project samples/demo/zypher.project.json
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION.TrimStart('v')
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'stage'
          if (Test-Path $prefix) { Remove-Item $prefix -Recurse -Force }
          $share = Join-Path $prefix 'share/zypher'
          New-Item -ItemType Directory -Force -Path (Join-Path $prefix 'bin'), (Join-Path $prefix 'lib'), (Join-Path $prefix 'include/zypher-editor'), $share | Out-Null

          $runtime = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter 'zypher_runtime.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $engineLib = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter 'zypher_engine.lib' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtime) { throw 'zypher_runtime.exe was not built' }
          if (-not $engineLib) { throw 'zypher_engine.lib was not built' }

          Copy-Item $runtime.FullName (Join-Path $prefix 'bin/zypher_runtime.exe')
          Copy-Item $engineLib.FullName (Join-Path $prefix 'lib/zypher_engine.lib')
          $editorLib = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter 'zypher_editor_core.lib' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($editorLib) { Copy-Item $editorLib.FullName (Join-Path $prefix 'lib/zypher_editor_core.lib') }
          Copy-Item engine/include/zypher (Join-Path $prefix 'include/zypher') -Recurse
          Copy-Item editor/core (Join-Path $prefix 'include/zypher-editor/core') -Recurse
          Copy-Item engine/shaders (Join-Path $share 'shaders') -Recurse
          Copy-Item samples (Join-Path $share 'samples') -Recurse
          Copy-Item docs (Join-Path $share 'docs') -Recurse
          Copy-Item README.md, LICENSE $share

          python tools/scripts/package_release.py --version $version --platform windows-x64 --input $prefix --output dist
          if ($LASTEXITCODE -ne 0) { throw "packaging failed with $LASTEXITCODE" }
          python -c "import sys, zipfile; members = zipfile.ZipFile(sys.argv[1]).namelist(); sys.exit(0 if any(n.endswith(sys.argv[2]) for n in members) else 1)" "dist/zypher-$version-windows-x64.zip" 'bin/zypher_runtime.exe'
          if ($LASTEXITCODE -ne 0) { throw 'packaged archive is missing bin/zypher_runtime.exe' }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lh dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; updating assets"
            gh release upload "$VERSION" dist/*.zip dist/*.sha256 --clobber
          else
            # Creates the tag at the dispatched commit when it does not exist yet.
            gh release create "$VERSION" dist/*.zip dist/*.sha256 \
              --title "Zypher ${VERSION#v}" \
              --notes-file docs/releases.md \
              --target "$GITHUB_SHA"
          fi
