name: Auto release

# Runs after a push to main. If the version in CMakeLists.txt has no release
# yet, it dispatches the Release workflow (which builds macOS + Windows archives
# and attaches them to the GitHub Release). Pushes that do not change the version
# do nothing, so normal development never publishes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-version:
    name: Release new version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve project version
        id: version
        run: |
          version=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          if [ -z "$version" ]; then
            echo "cannot read project version from CMakeLists.txt" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "project version: v$version"
      - name: Publish when missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          macos_asset="zypher-${VERSION}-macos-universal.zip"
          windows_asset="zypher-${VERSION}-windows-x64.zip"

          # A release can exist with a partial archive (the staging step once
          # shipped a macOS archive without the runtime), so verify the contents
          # before deciding the release is complete.
          archive_has_runtime() {
            asset="$1"
            member="$2"
            tmp=$(mktemp -d)
            if ! curl -sSL --fail -o "$tmp/asset.zip" \
                 "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${asset}"; then
              rm -rf "$tmp"
              return 1
            fi
            python3 - "$tmp/asset.zip" "$member" <<'PY'
          import sys
          import zipfile
          try:
              names = zipfile.ZipFile(sys.argv[1]).namelist()
          except Exception:
              sys.exit(1)
          sys.exit(0 if any(name.endswith(sys.argv[2]) for name in names) else 1)
          PY
            status=$?
            rm -rf "$tmp"
            return $status
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if printf '%s\n' "$assets" | grep -qx "$macos_asset" && \
               printf '%s\n' "$assets" | grep -qx "$windows_asset" && \
               archive_has_runtime "$macos_asset" "bin/zypher_runtime" && \
               archive_has_runtime "$windows_asset" "bin/zypher_runtime.exe"; then
              echo "release $TAG already publishes both complete archives; nothing to do"
              exit 0
            fi
            echo "release $TAG has missing or incomplete archives; re-running the release build"
          fi
          echo "dispatching release for $TAG"
          gh workflow run release.yml --ref main -f "tag=$TAG"
